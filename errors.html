<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>База ошибок — ArduInfo</title>
<style>
  :root {
    --bg: #0f1115; --surface: #1a1f26; --accent: #00c2c9;
    --text: #fff; --muted: #8ba0b0; --border: #2c3e50; --danger: #ff5f56;
  }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; line-height: 1.6; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { margin-bottom: 10px; }
  .search-box {
    width: 100%; padding: 15px 20px; font-size: 1.1rem;
    background: var(--surface); border: 2px solid var(--border); border-radius: 12px;
    color: #fff; margin-bottom: 30px; outline: none; transition: border 0.3s;
    box-sizing: border-box;
  }
  .search-box:focus { border-color: var(--accent); }
  .error-card {
    background: var(--surface); border-left: 4px solid var(--danger);
    border-radius: 8px; padding: 20px; margin-bottom: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  }
  .error-title {
    color: var(--danger); font-family: 'JetBrains Mono', monospace;
    font-size: 1rem; margin-bottom: 10px; font-weight: bold;
  }
  .error-desc { font-size: 1rem; margin-bottom: 15px; }
  .solution-box {
    background: rgba(0, 194, 201, 0.1); border: 1px solid var(--accent);
    padding: 15px; border-radius: 8px;
  }
  .solution-title { color: var(--accent); font-weight: bold; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 5px; }
  .solution-text { font-size: 0.95rem; }
  .code-fix {
    background: #0d1117; padding: 10px; border-radius: 6px; font-family: monospace;
    margin-top: 10px; color: #c9d1d9; border: 1px solid #333;
    overflow-x: auto; font-size: 0.9rem;
  }
  .highlight { color: var(--accent); font-weight: bold; }
  .empty { color: var(--muted); text-align: center; padding: 40px; }
</style>
</head>
<body>

<div class="container">
  <h1>🛠 База знаний по ошибкам</h1>
  <p style="color: var(--muted); margin-bottom: 20px;">Вставьте текст ошибки из Arduino IDE. Поиск поймет, даже если скопировать всю строку.</p>

  <input type="text" id="searchInput" class="search-box" placeholder="Например: expected ';' before '}'...">

  <div id="results"></div>
</div>

<script>
// 35 реальных, проверенных ошибок без воды
const ERRORS_DB = [
  // --- СИНТАКСИС ---
  { title: "expected ';' before '}' token", keywords: ["expected", "semicolon", "token", "before"], desc: "Пропущена точка с запятой в конце инструкции.", solution: "Проверьте строку перед закрывающей скобкой. Поставьте <code>;</code> после вызова функции.", example: "digitalWrite(13, HIGH)<span class='highlight'>;</span>" },
  { title: "expected '}' at end of input", keywords: ["expected", "end", "input", "brace"], desc: "Не хватает закрывающей фигурной скобки.", solution: "Проверьте, все ли открытые <code>{</code> закрыты. В конце скетча должна быть закрыта функция loop().", example: "void loop() { ... <span class='highlight'>}</span>" },
  { title: "expected initializer before 'int'", keywords: ["expected", "initializer", "before", "int"], desc: "Пропущена точка с запятой или скобка перед объявлением переменной.", solution: "Проверьте строку перед объявлением. Убедитесь, что предыдущая инструкция завершена <code>;</code>.", example: "int x = 5;<br><span class='highlight'>int y = 10;</span>" },
  { title: "stray '\\' in program", keywords: ["stray", "backslash", "program"], desc: "Лишний символ обратной косой черты в коде.", solution: "Уберите символ <code>\\</code> из указанной строки.", example: "" },
  { title: "stray '\\234' in program", keywords: ["stray", "234", "quotes", "smart"], desc: "В код попали «умные» кавычки при копировании.", solution: "Удалите кавычки и введите их заново с клавиатуры (полуширинные <code>\"</code> и <code>'</code>).", example: "" },
  { title: "missing terminating \" character", keywords: ["missing", "terminating", "character", "quote"], desc: "Не закрыта двойная кавычка.", solution: "Поставьте закрывающую <code>\"</code> в конце строки.", example: "Serial.print(<span class='highlight'>\"Hello\"</span>);" },

  // --- ОБЛАСТЬ ВИДИМОСТИ И ИМЕНА ---
  { title: "'variable' was not declared in this scope", keywords: ["declared", "scope", "variable"], desc: "Переменная не объявлена или допущена опечатка в имени.", solution: "Проверьте написание и регистр. Переменная должна быть объявлена до использования.", example: "<span class='highlight'>int ledPin = 13;</span>" },
  { title: "'pinMode' was not declared in this scope", keywords: ["pinmode", "declared", "scope"], desc: "Опечатка в названии функции (регистр).", solution: "Функции чувствительны к регистру: <code>pinMode</code> — верно, <code>pinmode</code> — ошибка.", example: "<span class='highlight'>pinMode</span>(13, OUTPUT);" },
  { title: "'Serial' was not declared in this scope", keywords: ["serial", "declared", "scope"], desc: "Не вызван Serial.begin().", solution: "Добавьте <code>Serial.begin(9600);</code> в функцию setup().", example: "void setup() { <span class='highlight'>Serial.begin(9600);</span> }" },
  { title: "redefinition of 'void setup()'", keywords: ["redefinition", "setup", "duplicate"], desc: "Функция setup() объявлена дважды.", solution: "В скетче может быть только одна <code>setup()</code> и одна <code>loop()</code>. Удалите дубликат.", example: "" },
  { title: "undefined reference to 'setup'", keywords: ["undefined", "reference", "setup"], desc: "В скетче отсутствует обязательная функция.", solution: "Скетч обязан содержать <code>void setup() { }</code> и <code>void loop() { }</code>.", example: "void setup() { }<br>void loop() { }" },
  { title: "'DHT' does not name a type", keywords: ["dht", "does not name", "type", "library"], desc: "Библиотека не установлена или не подключена.", solution: "Установите «DHT sensor library» от Adafruit через Менеджер библиотек.", example: "<span class='highlight'>#include &lt;DHT.h&gt;</span>" },

  // --- ТИПЫ ДАННЫХ ---
  { title: "invalid conversion from 'int' to 'const char*'", keywords: ["invalid", "conversion", "int", "char"], desc: "Число передаётся туда, где ожидается строка.", solution: "Используйте <code>String(число)</code>.", example: "Serial.print(<span class='highlight'>String(123)</span>);" },
  { title: "cannot convert 'String' to 'const char*'", keywords: ["string", "char", "convert", "const"], desc: "Функция ожидает C-строку, а передан объект String.", solution: "Используйте <code>.c_str()</code>.", example: "Serial.print(<span class='highlight'>myString.c_str()</span>);" },
  { title: "invalid conversion from 'const char*' to 'char'", keywords: ["invalid", "char", "quotes"], desc: "Строка в двойных кавычках присвоена типу char.", solution: "Для одного символа используйте одинарные кавычки: <code>'A'</code>.", example: "char grade = <span class='highlight'>'A'</span>;" },
  { title: "conversion from 'double' to 'float'", keywords: ["double", "float", "conversion"], desc: "Потеря точности при преобразовании.", solution: "Приведите явно: <code>(float)3.14</code>.", example: "float f = <span class='highlight'>(float)</span>3.1415926535;" },

  // --- БИБЛИОТЕКИ ---
  { title: "fatal error: <library>: No such file or directory", keywords: ["fatal", "no such file", "library", "include"], desc: "Библиотека не установлена или имя файла написано с ошибкой.", solution: "Установите библиотеку через Менеджер библиотек. Проверьте регистр в <code>#include</code>.", example: "<span class='highlight'>#include &lt;Servo.h&gt;</span>" },
  { title: "Multiple libraries were found for 'DHT.h'", keywords: ["multiple", "libraries", "found", "dht"], desc: "Установлено несколько версий библиотеки.", solution: "Удалите лишние версии из папки libraries. Оставьте только одну.", example: "" },
  { title: "'class Servo' has no member named 'attach'", keywords: ["servo", "member", "attach", "class"], desc: "Опечатка в имени метода или объект не создан.", solution: "Объявите объект и вызывайте метод правильно.", example: "Servo <span class='highlight'>myServo</span>;<br>myServo.attach(9);" },
  { title: "no matching function for call to 'tone(int, int)'", keywords: ["tone", "matching", "function", "call"], desc: "Неверное количество аргументов у tone().", solution: "tone() принимает 2 или 3 аргумента: <code>tone(pin, freq)</code>.", example: "<span class='highlight'>tone(8, 440);</span>" },
  { title: "lcd.init() is not available", keywords: ["lcd", "init", "liquidcrystal"], desc: "В вашей версии библиотеки метод называется иначе.", solution: "Попробуйте <code>lcd.begin(16, 2);</code>.", example: "lcd.<span class='highlight'>begin</span>(16, 2);" },

  // --- ЗАГРУЗКА / ПОРТ / AVRDUDE ---
  { title: "avrdude: stk500_recv(): programmer is not responding", keywords: ["avrdude", "stk500", "programmer", "responding", "port"], desc: "Компьютер не видит плату Arduino.", solution: "1. Проверьте USB-кабель. 2. Установите драйвер CH340 для клонов. 3. Выберите COM-порт.", example: "" },
  { title: "avrdude: ser_open(): can't open device", keywords: ["avrdude", "ser_open", "can't open", "device", "port"], desc: "Порт занят или плата отключена.", solution: "Закройте другие экземпляры IDE и монитор порта. Переподключите плату.", example: "" },
  { title: "avrdude: ser_open(): can't set com-state for COMn", keywords: ["avrdude", "com-state", "ch340", "driver"], desc: "Проблема с драйвером CH340 (часто на клонах Nano).", solution: "Установите актуальный драйвер CH340.", example: "" },
  { title: "Couldn't find a Board on the selected port", keywords: ["board", "selected", "port", "find"], desc: "Плата не определяется на выбранном порту.", solution: "Проверьте подключение, драйверы, выбранную модель платы.", example: "" },
  { title: "Error compiling for board Arduino Uno", keywords: ["error compiling", "board", "uno"], desc: "Общая ошибка компиляции.", solution: "Прочитайте первые строки вывода. Обычно это пропущенная <code>;</code>.", example: "" },
  { title: "exit status 1", keywords: ["exit status", "1"], desc: "Общая ошибка (компиляция или загрузка не удалась).", solution: "Смотрите строки перед «exit status 1» — там конкретная причина.", example: "" },

  // --- ЛОГИКА / ПАМЯТЬ ---
  { title: "invalid types 'int[int]' for array subscript", keywords: ["invalid", "types", "array", "subscript"], desc: "Массив индексируется неправильным типом.", solution: "Индекс массива должен быть целым числом.", example: "arr[<span class='highlight'>i</span>]" },
  { title: "array must be initialized with a brace-enclosed initializer", keywords: ["array", "initialized", "brace"], desc: "Массив объявлен без инициализации.", solution: "Используйте фигурные скобки для инициализации.", example: "int arr[] = <span class='highlight'>{1, 2, 3}</span>;" },
  { title: "assignment of read-only variable", keywords: ["assignment", "read-only", "variable", "const"], desc: "Попытка изменить константу.", solution: "Уберите <code>const</code>, если значение должно меняться.", example: "int x = 5; // без const" },
  { title: "warning: integer overflow in expression", keywords: ["warning", "integer", "overflow", "expression"], desc: "Переполнение при вычислении.", solution: "Используйте <code>long</code> или <code>float</code> для больших чисел.", example: "long x = 100000 * 1000;" },
  { title: "not enough memory", keywords: ["not enough", "memory", "ram", "sram"], desc: "Не хватает оперативной памяти (SRAM).", solution: "Используйте <code>F()</code> для строк, уменьшите размеры массивов, избегайте глобальных переменных.", example: "Serial.print(<span class='highlight'>F(\"Hello\")</span>);" },
  { title: "low memory available, stability problems may occur", keywords: ["low memory", "stability", "sram"], desc: "Мало свободной памяти.", solution: "Оптимизируйте код, используйте <code>F()</code> для строк.", example: "" },
  { title: "calling 'millis()' inside an interrupt", keywords: ["millis", "interrupt", "isr"], desc: "millis() не работает внутри прерываний.", solution: "Используйте <code>micros()</code> или таймеры для точных замеров в ISR.", example: "" },
  { title: "unable to find string literal operator", keywords: ["string literal", "operator"], desc: "Проблема с кодировкой или кавычками.", solution: "Проверьте, нет ли в строке непечатных символов.", example: "" },
  { title: "no return statement in function returning non-void", keywords: ["return", "statement", "non-void"], desc: "Функция должна возвращать значение, но не возвращает.", solution: "Добавьте <code>return значение;</code> в конце функции.", example: "int func() {<br>&nbsp;&nbsp;<span class='highlight'>return 0;</span><br>}" }
];

const searchInput = document.getElementById('searchInput');
const resultsDiv = document.getElementById('results');

function searchErrors(query) {
  const q = query.toLowerCase().trim();
  if (!q) return ERRORS_DB;

  const queryWords = q.split(/[\s,.:;!?()[\]{}'"]+/).filter(w => w.length > 2);

  return ERRORS_DB.filter(err => {
    const titleLower = err.title.toLowerCase();
    const descLower = err.desc.toLowerCase();
    
    if (titleLower.includes(q) || descLower.includes(q)) return true;
    
    return err.keywords.some(kw => q.includes(kw)) || 
           queryWords.some(word => titleLower.includes(word));
  });
}

function render() {
  const query = searchInput.value;
  const filtered = searchErrors(query);
  
  if (filtered.length === 0) {
    resultsDiv.innerHTML = '<div class="empty">Ничего не найдено. Попробуйте ввести ключевые слова (например, «expected», «Serial», «avrdude»).</div>';
    return;
  }

  resultsDiv.innerHTML = filtered.map(err => `
    <div class="error-card">
      <div class="error-title">${err.title}</div>
      <div class="error-desc">${err.desc}</div>
      <div class="solution-box">
        <div class="solution-title">Решение</div>
        <div class="solution-text">${err.solution}</div>
        ${err.example ? `<div class="code-fix">${err.example}</div>` : ''}
      </div>
    </div>
  `).join('');
}

searchInput.addEventListener('input', render);
render();
</script>

</body>
</html>
