<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — проводок отошёл — ArduInfo</title>
<meta name="robots" content="noindex, follow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#00979D;--accent-dark:#00767b;--accent-light:#00c2c9;--accent-soft:rgba(0,151,157,.10);
  --bg:#f4f8fa;--surface:#fff;--text:#12212b;--muted:#5d7280;--border:#dfe8ed;
  --font:'Inter',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
html[data-theme="dark"]{--accent:#00c2c9;--accent-dark:#00979D;--accent-soft:rgba(0,194,201,.12);--bg:#0c1218;--surface:#141c24;--text:#e3edf3;--muted:#8ba0b0;--border:#243240}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:20px;line-height:1.65}
.box{max-width:640px;width:100%;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:48px 32px;box-shadow:0 12px 40px rgba(16,42,55,.08)}
.icon{font-size:5rem;line-height:1;margin-bottom:20px;animation:wobble 3s ease-in-out infinite}
@keyframes wobble{
  0%,100%{transform:rotate(-8deg)}
  50%{transform:rotate(8deg)}
}
h1{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:900;letter-spacing:-.02em;margin-bottom:12px}
h1 span{color:var(--accent)}
p{color:var(--muted);font-size:1.05rem;margin-bottom:24px}
.wire{display:flex;align-items:center;justify-content:center;gap:0;margin:28px 0}
.wire-end{width:60px;height:6px;background:linear-gradient(90deg,#00979D,#00c2c9);border-radius:3px}
.wire-gap{width:40px;height:6px;border-top:3px dashed var(--muted);margin-top:3px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 24px;border-radius:11px;font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .15s,background .15s;border:1px solid transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.hint{font-family:var(--mono);font-size:.8rem;color:var(--muted);background:rgba(0,151,157,.08);padding:10px 16px;border-radius:8px;margin-top:26px;display:inline-block}
.theme-btn{position:fixed;top:20px;right:20px;width:40px;height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--border);cursor:pointer;font-size:1.1rem}
</style>
</head>
<body>
<button class="theme-btn" id="themeToggle" aria-label="Тема">🌙</button>
<div class="box">
  <div class="icon">🔌</div>
  <h1>404 — <span>проводок отошёл</span></h1>
  <p>Похоже, эта страница отвалилась от макетной платы. Или её тут никогда не было.</p>

  <div class="wire">
    <div class="wire-end"></div>
    <div class="wire-gap"></div>
    <div class="wire-end"></div>
  </div>

  <div class="actions">
    <a class="btn btn-primary" href="/">← На главную</a>
    <a class="btn btn-ghost" href="/#/projects">К проектам</a>
    <a class="btn btn-ghost" href="/#/resistor">Калькулятор</a>
  </div>

  <div class="hint">// error_code: 0x194</div>
</div>

<script>
(function(){
  let saved = null;
  try { saved = localStorage.getItem('arduinfo-theme'); } catch(e){}
  if(!saved) saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', saved);
  document.getElementById('themeToggle').textContent = saved === 'dark' ? '☀️' : '🌙';
})();
document.getElementById('themeToggle').addEventListener('click', function(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  this.textContent = next === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('arduinfo-theme', next); } catch(e){}
});
</script>
</body>
</html>
