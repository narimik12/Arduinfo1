<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Проверка иконок</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f8fa;padding:40px;color:#12212b}
h1{margin-bottom:30px;font-size:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px;max-width:900px}
.item{background:#fff;border:1px solid #dfe8ed;border-radius:12px;padding:20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.item span{font-size:.75rem;color:#5d7280;font-family:monospace}
</style>
</head>
<body>
<h1>Все иконки ArduInfo</h1>
<div class="grid" id="grid"></div>
<script src="icons.js"></script>
<script>
const names = Object.keys(ICONS);
document.getElementById('grid').innerHTML = names.map(function(n){
  return '<div class="item">' + icon(n, 32) + '<span>' + n + '</span></div>';
}).join('');
</script>
</body>
</html>
